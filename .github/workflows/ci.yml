name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create environment file
        run: cp .env.example .env

      - name: Build and start services
        run: docker compose up -d --build

      - name: Check polygon API migrations
        run: >
          docker compose exec -T polygon_api
          python manage.py makemigrations --check --dry-run

      - name: Apply polygon API migrations
        run: >
          docker compose exec -T polygon_api
          python manage.py migrate --noinput

      - name: Check polygon API
        run: >
          docker compose exec -T polygon_api
          python manage.py check

      - name: Check intersection service migrations
        run: >
          docker compose exec -T intersection_service
          python manage.py makemigrations --check --dry-run

      - name: Apply intersection service migrations
        run: >
          docker compose exec -T intersection_service
          python manage.py migrate --noinput

      - name: Check intersection service
        run: >
          docker compose exec -T intersection_service
          python manage.py check

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down -v
