name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create environment file
        run: cp .env.example .env

      - name: Build Docker images
        run: docker compose build

      - name: Start database
        run: |
          docker compose up -d db

          for attempt in {1..30}; do
            STATUS="$(docker inspect --format='{{.State.Status}}' alliance-it_postgis)"
            HEALTH="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' alliance-it_postgis)"

            echo "Database status: $STATUS, health: $HEALTH"

            if [ "$STATUS" = "exited" ]; then
              echo "=== PostgreSQL logs ==="
              docker compose logs --no-color db
              exit 1
            fi

            if [ "$HEALTH" = "healthy" ]; then
              exit 0
            fi

            sleep 2
          done

          echo "=== PostgreSQL logs ==="
          docker compose logs --no-color db
          exit 1

      - name: Start backend services
        run: docker compose up -d polygon_api intersection_service

      - name: Check polygon API migrations
        run: >
          docker compose exec -T polygon_api
          python manage.py makemigrations --check --dry-run

      - name: Apply polygon API migrations
        run: >
          docker compose exec -T polygon_api
          python manage.py migrate --noinput

      - name: Check polygon API
        run: >
          docker compose exec -T polygon_api
          python manage.py check

      - name: Check intersection service migrations
        run: >
          docker compose exec -T intersection_service
          python manage.py makemigrations --check --dry-run

      - name: Apply intersection service migrations
        run: >
          docker compose exec -T intersection_service
          python manage.py migrate --noinput

      - name: Check intersection service
        run: >
          docker compose exec -T intersection_service
          python manage.py check

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down -v