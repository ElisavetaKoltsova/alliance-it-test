repos:
  - repo: local
    hooks:
      - id: frontend-lint
        name: Frontend lint
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        files: ^frontend/

      - id: frontend-format
        name: Frontend format check
        entry: npm --prefix frontend run format:check
        language: system
        pass_filenames: false
        files: ^frontend/
